{% load static %}

<!DOCTYPE html>
<html lang="en" id="top">
    <head>
        <meta charset="utf-8">
        <title>My Personal Blog</title>
        <link rel="stylesheet" href="{% static 'blogApp/styles.css' %}">
        <meta name="keywords" content="">
        <meta name="description" content="">
        <meta name="author" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.27/dist/lenis.css">
        <script src="https://unpkg.com/lenis@1.3.27/dist/lenis.min.js"></script> 
        <script>new Lenis({ autoRaf: true, autoToggle: true, anchors: true, allowNestedScroll: true, naiveDimensions: true, stopInertiaOnNavigate: true })</script>
    </head>
    <body>
        <header>
            <h1>My Personal Blog</h1>
            <nav>
                <a href="{% url "blog_index" %}">Home</a>
                <hr>
            </nav>
        </header>
        <main>
            {% block page_title %}{% endblock page_title %}
            {% block page_content %}{% endblock page_content %}
        </main>
        <footer>
            <hr>
            <div></div>
            <div class="footer-bottom">
                <p>Copyright (©) ____ 2026</p>
                <p><a href="#">Privacy Policy</a></p>
                <p><a href="#"> Cookie Policy</a></p>
                <a href="#top" class="exclude"><img class="to-top" src="{% static 'blogApp/up-arrow.svg'%}" alt="up arrow"></a>
            </div>
        </footer>
    </body>
</html>
